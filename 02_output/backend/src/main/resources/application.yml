# Settings that differ between environments come from environment variables (ES-01, spec §3).
# Entries without a default are required: the backend does not start without them.
spring:
  application:
    name: registration-backend
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${POSTGRES_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}
      mail.smtp.starttls.required: ${SMTP_STARTTLS:true}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  jackson:
    deserialization:
      fail-on-unknown-properties: true

server:
  forward-headers-strategy: native
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    include-exception: false
    whitelabel:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

app:
  conference:
    name: ${CONFERENCE_NAME:Conference}
    config-location: ${CONFERENCE_CONFIG}
  storage:
    json-copy-dir: ${JSON_COPY_DIR:/data/json-copies}
  mail:
    from: ${MAIL_FROM:registration@konferenca.local}
    organizer-recipients: ${ORGANIZER_EMAILS}
  recaptcha:
    test-mode: ${RECAPTCHA_TEST_MODE:false}
    site-key: ${RECAPTCHA_SITE_KEY:}
    secret-key: ${RECAPTCHA_SECRET_KEY:}
    verify-url: ${RECAPTCHA_VERIFY_URL:https://www.google.com/recaptcha/api/siteverify}
  organizer:
    username: ${ORGANIZER_USERNAME}
    password: ${ORGANIZER_PASSWORD}
    https-only: ${ORGANIZER_HTTPS_ONLY:true}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  rate-limit:
    form-config-per-minute: ${RATE_LIMIT_FORM_CONFIG_PER_MINUTE:60}
    registrations-per-minute: ${RATE_LIMIT_REGISTRATIONS_PER_MINUTE:10}
    export-per-minute: ${RATE_LIMIT_EXPORT_PER_MINUTE:10}
  request:
    max-body-bytes: ${REQUEST_MAX_BODY_BYTES:16384}
