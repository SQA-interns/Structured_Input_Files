# Contract: frontend / organizer <-> backend (REST). Spec: docs/02_specification.md section 4.
openapi: 3.1.0
info:
  title: Conference registration API
  version: 1.0.0
servers:
  - url: /
paths:
  /api/form-config:
    get:
      operationId: getFormConfig
      summary: Conference name, active options, consents and reCAPTCHA settings for the form
      responses:
        "200":
          description: Form configuration (only active options)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FormConfig"
  /api/registrations:
    post:
      operationId: createRegistration
      summary: Submit a registration (public, reCAPTCHA protected, rate and size limited)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistrationRequest"
      responses:
        "201":
          description: Accepted; stored in the database and as a JSON copy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationAccepted"
        "400":
          description: VALIDATION_FAILED or CAPTCHA_FAILED; nothing stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: DUPLICATE_EMAIL; nothing stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: PAYLOAD_TOO_LARGE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "415":
          description: UNSUPPORTED_MEDIA_TYPE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: TOO_MANY_REQUESTS (with Retry-After header)
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: INTERNAL_ERROR; nothing stored, no email sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/export/registrations.xlsx:
    get:
      operationId: exportRegistrations
      summary: Excel export of all registrations (organizer only, HTTPS only outside localhost)
      security:
        - organizerBasic: []
      responses:
        "200":
          description: Workbook with one row per registration
          headers:
            Content-Disposition:
              schema:
                type: string
                example: attachment; filename="registrations.xlsx"
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        "401":
          description: UNAUTHORIZED (missing or wrong credentials)
          headers:
            WWW-Authenticate:
              schema:
                type: string
                example: Basic realm="organizer"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: HTTPS_REQUIRED (plain HTTP from a non-loopback client while HTTPS-only is on)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: TOO_MANY_REQUESTS
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  securitySchemes:
    organizerBasic:
      type: http
      scheme: basic
  schemas:
    RegistrationType:
      type: string
      enum: [EXTERNAL, STUDENT]
    OptionCategory:
      type: string
      enum: [WORKSHOP, EVENT, MEAL, OTHER]
    Option:
      type: object
      required: [id, name, category, audience]
      properties:
        id:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]{0,63}$"
        name:
          type: string
        category:
          $ref: "#/components/schemas/OptionCategory"
        audience:
          type: array
          items:
            $ref: "#/components/schemas/RegistrationType"
    Consent:
      type: object
      required: [id, text, mandatory]
      properties:
        id:
          type: string
        text:
          type: string
        mandatory:
          type: boolean
    FormConfig:
      type: object
      required: [conferenceName, options, consents, recaptcha]
      properties:
        conferenceName:
          type: string
        options:
          type: array
          items:
            $ref: "#/components/schemas/Option"
        consents:
          type: array
          items:
            $ref: "#/components/schemas/Consent"
        recaptcha:
          type: object
          required: [siteKey, testMode]
          properties:
            siteKey:
              type: string
              description: Public site key from configuration; may be empty in test mode
            testMode:
              type: boolean
    RegistrationRequest:
      type: object
      required: [type, firstName, lastName, email, optionIds, consentIds, captchaToken]
      description: >
        EXTERNAL requires organization; STUDENT requires studyInstitution, studyProgramme and
        studentId. Fields of the other type must be absent, null or empty. Strings are trimmed;
        at most 200 characters (email 254); control characters are rejected.
      properties:
        type:
          $ref: "#/components/schemas/RegistrationType"
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        organization:
          type: [string, "null"]
        studyInstitution:
          type: [string, "null"]
        studyProgramme:
          type: [string, "null"]
        studentId:
          type: [string, "null"]
        optionIds:
          type: array
          items:
            type: string
        consentIds:
          type: array
          items:
            type: string
        captchaToken:
          type: string
    AcceptedOption:
      type: object
      required: [id, name, category]
      properties:
        id:
          type: string
        name:
          type: string
        category:
          $ref: "#/components/schemas/OptionCategory"
    RegistrationAccepted:
      type: object
      required: [reference, submittedAt, type, firstName, lastName, options]
      properties:
        reference:
          type: string
          format: uuid
        submittedAt:
          type: string
          format: date-time
        type:
          $ref: "#/components/schemas/RegistrationType"
        firstName:
          type: string
        lastName:
          type: string
        options:
          type: array
          items:
            $ref: "#/components/schemas/AcceptedOption"
    FieldError:
      type: object
      required: [field, code, message]
      properties:
        field:
          type: string
          description: >
            Request property name (firstName, lastName, email, organization, studyInstitution,
            studyProgramme, studentId, type, captchaToken); "optionIds" for option errors;
            "consents.<consentId>" for consent errors.
        code:
          type: string
          enum:
            - REQUIRED
            - TOO_LONG
            - INVALID_CHARACTERS
            - INVALID_EMAIL
            - NOT_ALLOWED
            - UNKNOWN_OPTION
            - OPTION_NOT_AVAILABLE
            - DUPLICATE_OPTION
            - CONSENT_REQUIRED
            - UNKNOWN_CONSENT
            - CAPTCHA_FAILED
            - DUPLICATE_EMAIL
            - INVALID_VALUE
        message:
          type: string
    Error:
      type: object
      required: [status, error, message, fieldErrors]
      properties:
        status:
          type: integer
        error:
          type: string
          enum:
            - VALIDATION_FAILED
            - CAPTCHA_FAILED
            - DUPLICATE_EMAIL
            - UNAUTHORIZED
            - HTTPS_REQUIRED
            - PAYLOAD_TOO_LARGE
            - UNSUPPORTED_MEDIA_TYPE
            - TOO_MANY_REQUESTS
            - NOT_FOUND
            - INTERNAL_ERROR
        message:
          type: string
        fieldErrors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
