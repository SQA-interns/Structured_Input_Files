# Local stack (environments.md "local"): docker compose --env-file ../.env up -d --build
# Build the backend jar first: (cd backend && ./mvnw -B package -DskipTests)
name: conference-registration

services:
  postgres:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_DB: registration
      POSTGRES_USER: registration
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U registration -d registration"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.31.1
    ports:
      - "127.0.0.1:8025:8025"

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      APP_ENVIRONMENT: local
      APP_CONFERENCE_NAME: ${APP_CONFERENCE_NAME:-Konferenca 2026}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/registration
      SPRING_DATASOURCE_USERNAME: registration
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: "1025"
      APP_MAIL_STARTTLS: "false"
      APP_RECAPTCHA_TEST_MODE: "true"
      APP_ORGANIZER_HTTPS_ONLY: "false"
      ORGANIZER_USERNAME: ${ORGANIZER_USERNAME:?set ORGANIZER_USERNAME in .env}
      ORGANIZER_PASSWORD: ${ORGANIZER_PASSWORD:?set ORGANIZER_PASSWORD in .env}
      ORGANIZER_EMAILS: ${ORGANIZER_EMAILS:?set ORGANIZER_EMAILS in .env}
    volumes:
      - jsoncopies:/data/json-copies
    ports:
      - "127.0.0.1:8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:8080"

volumes:
  pgdata:
  jsoncopies:
